<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stargate Weapon Refs</title><style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e8ee;--dim:#8b93a7;--acc:#f0a43a;--good:#5fd38d;--warn:#e8c25a;--bad:#e06c6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Segoe UI,sans-serif;display:flex;height:100vh;overflow:hidden}
aside{width:300px;min-width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.ctl{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ctl input[type=search],.ctl select{width:100%;padding:7px 9px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.ctl label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px}
#list{overflow:auto;flex:1}#list .f{padding:10px 12px 4px;color:var(--acc);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#list a{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;color:var(--fg);text-decoration:none;cursor:pointer}
#list a:hover,#list a.on{background:#222836}#list a span{color:var(--dim);font-size:12px}
main{flex:1;overflow:auto;padding:18px 22px}h1{margin:0 0 4px;font-size:22px}.meta{color:var(--dim);margin:0 0 4px;max-width:1100px}
.meta b{color:var(--fg);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;position:relative}
.card.best{border-color:var(--acc)}.card img{width:100%;height:190px;object-fit:contain;background:#07080b;display:block}
.cap{padding:7px 9px;font-size:12px;color:var(--dim)}.cap .t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.tag{padding:1px 6px;border-radius:4px;background:#232a38;color:var(--fg);font-size:11px}.tag.q5,.tag.q4{background:#1d3b2a;color:var(--good)}
.tag.q3{background:#3a3420;color:var(--warn)}.tag.q2,.tag.q1{background:#3b2222;color:var(--bad)}.tag.b{background:var(--acc);color:#1a1205;font-weight:700}
.tag.u{background:#3a3420;color:var(--warn)}#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9}
#lb img{max-width:94vw;max-height:84vh;object-fit:contain}#lb .c{color:var(--dim);margin-top:10px;max-width:90vw;text-align:center}#lb a{color:var(--acc)}
.empty{color:var(--dim);margin-top:40px}
.hide{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(15,17,21,.85);color:var(--fg);font-size:15px;line-height:1;cursor:pointer;opacity:.55}
.hide:hover{opacity:1;border-color:var(--bad);color:var(--bad)}
#unhide{padding:7px 9px;background:var(--bg);color:var(--acc);border:1px solid var(--line);border-radius:6px;cursor:pointer}#unhide:disabled{color:var(--dim);cursor:default}
@media (max-width:760px){body{flex-direction:column;height:auto;overflow:auto}aside{width:100%;min-width:0;max-height:45vh}main{padding:14px 16px}}
</style></head><body>

<label><input id="bestonly" type="checkbox"> Best picks only</label>
<label><input id="unclear" type="checkbox" checked> Show "unclear" images</label>
<label><input id="dropped" type="checkbox"> Include dropped (handheld) weapons</label>
<button id="unhide" disabled>Unhide all (0)</button>
</div><div id="list"></div></aside>
<main id="main"></main>

const $=id=>document.getElementById(id);let cur=null;
const HK='sgd-hidden';let H;try{H=new Set(JSON.parse(localStorage.getItem(HK)||'[]'))}catch(e){H=new Set()}
function saveH(){try{localStorage.setItem(HK,JSON.stringify([...H]))}catch(e){}$('unhide').disabled=!H.size;$('unhide').textContent=`Unhide all (${H.size})`}
const facs=[...new Set(D.map(w=>w.faction))].sort();facs.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;$('fac').appendChild(o)});
function keep(i){if(H.has(i.src))return false;if(i.q<+$('minq').value)return false;if($('bestonly').checked&&!i.best)return false;if(!$('unclear').checked&&i.v==='unclear')return false;return true}
function visible(){const q=$('q').value.toLowerCase(),f=$('fac').value;return D.filter(w=>(w.scope||$('dropped').checked)&&(!f||w.faction===f)&&(!q||w.name.toLowerCase().includes(q)))}
function list(){const L=$('list');L.innerHTML='';let last='';visible().forEach(w=>{if(w.faction!==last){last=w.faction;const h=document.createElement('div');h.className='f';h.textContent=last;L.appendChild(h)}
const a=document.createElement('a');a.innerHTML=`${w.name}<span>${w.imgs.filter(keep).length}</span>`;if(cur===w)a.className='on';a.onclick=()=>{cur=w;show();list()};L.appendChild(a)});
if(!cur||!visible().includes(cur)){cur=visible()[0]||null;show()}}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(){const M=$('main');if(!cur){M.innerHTML='<p class="empty">No weapons match.</p>';return}const im=cur.imgs.filter(keep);
M.innerHTML=`<h1>${esc(cur.name)}</h1><p class="meta">${esc(cur.faction)} · ${esc(cur.scale)} · ${im.length} of ${cur.imgs.length} images</p>`+
(cur.coverage?`<p class="meta"><b>Angles:</b> ${esc(cur.coverage)}</p>`:'')+(cur.dims?`<p class="meta"><b>Scale:</b> ${esc(cur.dims)}</p>`:'')+(cur.notes?`<p class="meta"><b>Notes:</b> ${esc(cur.notes)}</p>`:'')+
`<div class="grid">${im.map((i,n)=>`<div class="card${i.best?' best':''}" data-n="${n}"><button class="hide" title="Hide this image" data-n="${n}">×</button><img loading="lazy" src="${esc(i.src)}"><div class="cap"><div class="t">${i.best?`<span class="tag b">BEST ${i.best}</span>`:''}<span class="tag q${i.q}">q${i.q||'?'}</span><span class="tag">${esc(i.kind)}</span>${i.views.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}${i.v==='unclear'?'<span class="tag u">unclear</span>':''}</div>${esc(i.note)}${i.w?` <span>(${i.w}×${i.h})</span>`:''}</div></div>`).join('')}</div>`;
M.querySelectorAll('.hide').forEach(b=>b.onclick=e=>{e.stopPropagation();H.add(im[+b.dataset.n].src);saveH();list();show()});M.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const i=im[+c.dataset.n];$('lbi').src=i.src;$('lbc').innerHTML=`${esc(i.note)} · <a href="${esc(i.url)}" target="_blank" onclick="event.stopPropagation()">source</a> · ${esc(i.src)}`;$('lb').style.display='flex'});M.scrollTop=0}
$('unhide').onclick=()=>{H.clear();saveH();list();show()};saveH();
['q','fac','minq','bestonly','unclear','dropped'].forEach(id=>$(id).addEventListener('input',()=>{list();show()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').style.display='none'});
const start=D.find(w=>w.name.startsWith('Destiny pulse turret'));if(start)cur=start;list();show();
</script></body></html>
