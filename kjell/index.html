<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kjell · Work</title>
<meta name="description" content="Artwork by Kjell.">
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="moonraft/icon-192.png">
<style>
  :root { --bg: #0b0c0e; --fg: #d2d4d8; --dim: #8a8f99; --line: #23262d; --card: #131519; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto;
         padding: calc(48px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { margin-bottom: 36px; }
  h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 600; letter-spacing: -.01em; margin: 0; }
  header p { color: var(--dim); margin: 6px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; }
  .card { display: block; color: inherit; text-decoration: none; background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; transition: border-color .2s, transform .2s; }
  .card:hover, .card:focus-visible { border-color: #4a4f5a; transform: translateY(-2px); outline: none; }
  .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 40%; background: #1a1c20; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px 14px; }
  .meta h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .meta span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  footer { margin-top: 48px; color: #555a64; font-size: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kjell</h1>
    <p>Living pieces. Tap one, then the menu to play with it.</p>
  </header>

  <section class="grid">
    <a class="card" href="moonraft/">
      <img src="moonraft/thumb.jpg" alt="Moon Raft: pencil drawing on dotted paper of a raft with a pennant on the water, a huge moon rising behind a line of trees" loading="lazy">
      <div class="meta"><h2>Moon Raft · v1</h2><span>live</span></div>
    </a>
    <a class="card" href="moonraft-v2/">
      <img src="moonraft-v2/thumb.jpg" alt="Moon Raft v2: the same pencil drawing, with the raft flicked out across the water toward the moon and the treeline shrunk" loading="lazy">
      <div class="meta"><h2>Moon Raft · v2</h2><span>touch the raft</span></div>
    </a>
    <a class="card" href="poncho/">
      <img src="poncho/thumb.jpg" alt="Poncho in the Wind: coloured-pencil drawing on dotted paper of a hooded figure from behind in a pink striped poncho with blue crosses and diamonds" loading="lazy">
      <div class="meta"><h2>Poncho in the Wind</h2><span>live</span></div>
    </a>
    <!-- next piece: copy the card above, point it at kjell/<name>/ -->
  </section>

  <footer>hosted at <a href="/">klaasm.be</a></footer>
</main>
</body>
</html>
