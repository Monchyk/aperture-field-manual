    if (!paused) { acc_t += dt; while (acc_t >= DT) { step(false); acc_t -= DT; } }
    controls.update(); draw(); requestAnimationFrame(loop);
  })(last);
}
})().catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;top:16px;left:16px;color:#c0392b">' + e + '</pre>'); console.error(e); });
