const shadowMat = new THREE.ShaderMaterial({
  uniforms: { map: { value: clothTex } }, transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; varying float vH;
    void main(){ vUv = uv; vH = position.z; vec3 p = position; p.xy += vec2(0.35, -0.45) * p.z; p.z = -0.002;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0); }`,
  fragmentShader: `uniform sampler2D map; varying vec2 vUv; varying float vH;
    void main(){ float a = texture2D(map, vUv).a * clamp(vH * 18.0, 0.0, 1.0) * 0.32; if (a < 0.003) discard;
      gl_FragColor = vec4(0.08, 0.06, 0.05, a); }`
});
const shadowMesh = new THREE.Mesh(geo, shadowMat); shadowMesh.frustumCulled = false; scene.add(shadowMesh);

function draw() {
  posAttr.needsUpdate = true; geo.computeVertexNormals();
  renderer.render(scene, camera);
}

function fit() {
  if (RECORD) { renderer.setSize(1080, 1440, false); renderer.domElement.style.width = '1080px'; renderer.domElement.style.height = '1440px'; return; }
  const h = Math.min(innerHeight - 32, (innerWidth - 32) / G.aspect), w = h * G.aspect;
  renderer.setSize(w, h);
}
addEventListener('resize', fit); fit();
reset();

if (RECORD) {
  // driven frame-by-frame by render_mp4.py
  let frame = 0;
  window.renderFrame = (i) => { while (simT < i / 30 - 1e-9) step(false); draw(); frame = i; return frame; };
  window.renderer_png = () => renderer.domElement.toDataURL('image/png');
  draw(); window.ready = true;
} else {
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.target.set(0, 0, 0);
  controls.minDistance = 0.6; controls.maxDistance = 6;
  let paused = false, last = performance.now(), acc_t = 0;
  const $ = id => document.getElementById(id);
  $('wind').oninput = e => params.wind = +e.target.value;
  $('gust').oninput = e => params.gust = +e.target.value;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; };
  $('replay').onclick = () => { reset(); camera.position.set(0, 0, DIST); controls.target.set(0, 0, 0); };
  if (location.protocol !== 'file:') $('rec').style.display = 'none';   // downloads only work when opened locally
  $('rec').onclick = () => {
    const stream = renderer.domElement.captureStream(30);
    const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 12e6 });
    const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type }));
      a.download = 'poncho_cloth.' + (type.includes('mp4') ? 'mp4' : 'webm'); a.click();
      $('rec').textContent = 'Record 12s'; $('rec').disabled = false;
    };
    reset(); rec.start(); $('rec').textContent = 'Recording...'; $('rec').disabled = true;
    setTimeout(() => rec.stop(), 12000);
  };
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) { acc_t += dt; while (acc_t >= DT) { step(false); acc_t -= DT; } }
    controls.update(); draw(); requestAnimationFrame(loop);
  })(last);
}
})().catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;top:16px;left:16px;color:#c0392b">' + e + '</pre>'); console.error(e); });
</script>
